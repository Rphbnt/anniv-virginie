<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Joyeux Anniversaire Virginie</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #fdf6ef;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #scene {
      position: relative;
      width: 100%;
      max-width: 860px;
      height: 420px;
      overflow: hidden;
      background: #fdf6ef;
      border-radius: 16px;
    }

    canvas#petals {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    .text-wrap {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px; pointer-events: none;
    }

    .line1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2.2rem, 7vw, 3.6rem);
      color: #c9975a;
      opacity: 0; transform: translateY(22px);
      animation: riseIn 1.1s cubic-bezier(.22,1,.36,1) .3s forwards;
      letter-spacing: .02em;
    }
    .line2 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2.8rem, 9vw, 5rem);
      color: #3d1f2b;
      opacity: 0; transform: translateY(28px);
      animation: riseIn 1.2s cubic-bezier(.22,1,.36,1) .65s forwards;
      letter-spacing: .01em;
    }
    .line2 em { color: #e8799a; font-style: normal; }
    .line3 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2rem, 6vw, 3rem);
      color: #7a9e7e;
      opacity: 0; transform: translateY(20px);
      animation: riseIn 1s cubic-bezier(.22,1,.36,1) 1.05s forwards;
      letter-spacing: .04em;
    }

    @keyframes riseIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .svg-flowers {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    .f0 { animation: sway 4s ease-in-out infinite; transform-origin: 38px 165px; }
    .f1 { animation: sway 5s ease-in-out .8s infinite; transform-origin: 642px 170px; }
    .f2 { animation: bob 3.5s ease-in-out .4s infinite; transform-origin: 80px 48px; }
    .f3 { animation: bob 4.2s ease-in-out 1.2s infinite; transform-origin: 600px 52px; }
    .f4 { animation: sway 6s ease-in-out .2s infinite; transform-origin: 55px 362px; }
    .f5 { animation: sway 5.5s ease-in-out 1s infinite; transform-origin: 625px 368px; }
    .f6 { animation: bob 4s ease-in-out .6s infinite; transform-origin: 170px 392px; }
    .f7 { animation: bob 3.8s ease-in-out 1.4s infinite; transform-origin: 510px 388px; }
    .f8 { animation: sway 7s ease-in-out .3s infinite; transform-origin: 340px 28px; }

    @keyframes sway {
      0%,100% { transform: rotate(-9deg) scale(1); }
      50%      { transform: rotate(9deg) scale(1.04); }
    }
    @keyframes bob {
      0%,100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-8px) scale(1.05); }
    }

    .bloom { opacity:0; animation: bloom 1s cubic-bezier(.34,1.56,.64,1) forwards; }
    .b0{animation-delay:0s} .b1{animation-delay:.2s} .b2{animation-delay:.35s}
    .b3{animation-delay:.5s} .b4{animation-delay:.65s} .b5{animation-delay:.8s}
    .b6{animation-delay:.95s} .b7{animation-delay:1.1s} .b8{animation-delay:1.25s}

    @keyframes bloom {
      0%   { opacity:0; transform: scale(0) rotate(-30deg); }
      70%  { opacity:1; transform: scale(1.12) rotate(6deg); }
      100% { opacity:1; transform: scale(1) rotate(0deg); }
    }
  </style>
</head>
<body>

<div id="scene">
  <canvas id="petals"></canvas>

  <svg class="svg-flowers" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <g id="fl-rose">
        <ellipse cx="0" cy="-18" rx="9" ry="18" fill="#e8799a" opacity=".9"/>
        <ellipse cx="0" cy="-18" rx="9" ry="18" fill="#e8799a" opacity=".9" transform="rotate(60)"/>
        <ellipse cx="0" cy="-18" rx="9" ry="18" fill="#e8799a" opacity=".9" transform="rotate(120)"/>
        <ellipse cx="0" cy="-18" rx="9" ry="18" fill="#f4b8cb" opacity=".85" transform="rotate(30)"/>
        <ellipse cx="0" cy="-18" rx="9" ry="18" fill="#f4b8cb" opacity=".85" transform="rotate(90)"/>
        <ellipse cx="0" cy="-18" rx="9" ry="18" fill="#f4b8cb" opacity=".85" transform="rotate(150)"/>
        <circle cx="0" cy="0" r="9" fill="#fdf6ef"/>
        <circle cx="0" cy="0" r="5" fill="#c9975a"/>
      </g>
      <g id="fl-gold">
        <ellipse cx="0" cy="-16" rx="8" ry="16" fill="#c9975a" opacity=".9"/>
        <ellipse cx="0" cy="-16" rx="8" ry="16" fill="#c9975a" opacity=".9" transform="rotate(72)"/>
        <ellipse cx="0" cy="-16" rx="8" ry="16" fill="#c9975a" opacity=".9" transform="rotate(144)"/>
        <ellipse cx="0" cy="-16" rx="8" ry="16" fill="#f7d4c0" opacity=".85" transform="rotate(36)"/>
        <ellipse cx="0" cy="-16" rx="8" ry="16" fill="#f7d4c0" opacity=".85" transform="rotate(108)"/>
        <circle cx="0" cy="0" r="8" fill="#fdf6ef"/>
        <circle cx="0" cy="0" r="4" fill="#e8799a"/>
      </g>
      <g id="fl-green">
        <ellipse cx="0" cy="-14" rx="7" ry="14" fill="#7a9e7e" opacity=".9"/>
        <ellipse cx="0" cy="-14" rx="7" ry="14" fill="#7a9e7e" opacity=".9" transform="rotate(60)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="14" fill="#7a9e7e" opacity=".9" transform="rotate(120)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="14" fill="#a0c4a4" opacity=".8" transform="rotate(30)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="14" fill="#a0c4a4" opacity=".8" transform="rotate(90)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="14" fill="#a0c4a4" opacity=".8" transform="rotate(150)"/>
        <circle cx="0" cy="0" r="7" fill="#fdf6ef"/>
        <circle cx="0" cy="0" r="3.5" fill="#c9975a"/>
      </g>
      <g id="fl-blush">
        <ellipse cx="0" cy="-20" rx="10" ry="20" fill="#f4b8cb" opacity=".9"/>
        <ellipse cx="0" cy="-20" rx="10" ry="20" fill="#f4b8cb" opacity=".9" transform="rotate(72)"/>
        <ellipse cx="0" cy="-20" rx="10" ry="20" fill="#f4b8cb" opacity=".9" transform="rotate(144)"/>
        <ellipse cx="0" cy="-20" rx="10" ry="20" fill="#e8799a" opacity=".7" transform="rotate(36)"/>
        <ellipse cx="0" cy="-20" rx="10" ry="20" fill="#e8799a" opacity=".7" transform="rotate(108)"/>
        <circle cx="0" cy="0" r="10" fill="#fdf6ef"/>
        <circle cx="0" cy="0" r="5.5" fill="#7a9e7e"/>
      </g>
      <g id="leaf">
        <ellipse cx="0" cy="-10" rx="5" ry="12" fill="#7a9e7e" opacity=".7"/>
      </g>
    </defs>

    <g class="f0 bloom b0" transform="translate(38,165)">
      <use href="#leaf" transform="translate(-12,14) rotate(-35)"/>
      <use href="#leaf" transform="translate(10,18) rotate(30)"/>
      <use href="#fl-rose" transform="scale(1.7)"/>
    </g>
    <g class="f1 bloom b1" transform="translate(642,170)">
      <use href="#leaf" transform="translate(-12,14) rotate(-35)"/>
      <use href="#leaf" transform="translate(10,18) rotate(30)"/>
      <use href="#fl-rose" transform="scale(1.7)"/>
    </g>
    <g class="f2 bloom b2" transform="translate(80,48)">
      <use href="#leaf" transform="translate(-8,12) rotate(-30)"/>
      <use href="#fl-gold" transform="scale(1.2)"/>
    </g>
    <g class="f3 bloom b3" transform="translate(600,52)">
      <use href="#leaf" transform="translate(8,14) rotate(30)"/>
      <use href="#fl-blush" transform="scale(1.3)"/>
    </g>
    <g class="f4 bloom b4" transform="translate(55,362)">
      <use href="#leaf" transform="translate(-9,12) rotate(-25)"/>
      <use href="#fl-green" transform="scale(1.4)"/>
    </g>
    <g class="f5 bloom b5" transform="translate(625,368)">
      <use href="#leaf" transform="translate(9,14) rotate(28)"/>
      <use href="#fl-gold" transform="scale(1.4)"/>
    </g>
    <g class="f6 bloom b6" transform="translate(170,392)">
      <use href="#fl-rose" transform="scale(1)"/>
    </g>
    <g class="f7 bloom b7" transform="translate(510,388)">
      <use href="#fl-blush" transform="scale(.9)"/>
    </g>
    <g class="f8 bloom b8" transform="translate(340,28)">
      <use href="#fl-green" transform="scale(1)"/>
    </g>

    <path d="M38,165 Q60,320 55,362" stroke="#7a9e7e" stroke-width="1.5" fill="none" opacity=".4"/>
    <path d="M642,170 Q625,310 625,368" stroke="#7a9e7e" stroke-width="1.5" fill="none" opacity=".4"/>
    <path d="M80,48 Q120,380 170,392" stroke="#7a9e7e" stroke-width="1" fill="none" opacity=".3"/>
    <path d="M600,52 Q560,370 510,388" stroke="#7a9e7e" stroke-width="1" fill="none" opacity=".3"/>
  </svg>

  <div class="text-wrap">
    <div class="line1">Joyeux</div>
    <div class="line2"><em>Anniversaire</em></div>
    <div class="line3">Virginie 🌸</div>
  </div>
</div>

<script>
  const cvs = document.getElementById('petals');
  const ctx = cvs.getContext('2d');

  function resize() {
    const r = cvs.parentElement.getBoundingClientRect();
    cvs.width = r.width; cvs.height = r.height;
  }
  resize();

  const COLS = ['#e8799a','#f4b8cb','#f7d4c0','#c9975a','#7a9e7e','#e2a0b8'];

  class P {
    constructor() { this.reset(true); }
    reset(init) {
      this.x = Math.random() * cvs.width;
      this.y = init ? Math.random() * cvs.height : -20;
      this.r = 4 + Math.random() * 8;
      this.vx = (Math.random() - .5) * .5;
      this.vy = .5 + Math.random() * .8;
      this.rot = Math.random() * Math.PI * 2;
      this.vr = (Math.random() - .5) * .04;
      this.c = COLS[Math.floor(Math.random() * COLS.length)];
      this.a = .2 + Math.random() * .35;
    }
    step() {
      this.x += this.vx + Math.sin(Date.now() * .001 + this.y * .01) * .25;
      this.y += this.vy;
      this.rot += this.vr;
      if (this.y > cvs.height + 20) this.reset(false);
    }
    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      ctx.globalAlpha = this.a;
      ctx.fillStyle = this.c;
      ctx.beginPath();
      ctx.ellipse(0, 0, this.r, this.r * 1.8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  const ptls = Array.from({ length: 40 }, () => new P());

  function loop() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    ptls.forEach(p => { p.step(); p.draw(); });
    requestAnimationFrame(loop);
  }
  loop();

  window.addEventListener('resize', resize);
</script>

</body>
</html>
